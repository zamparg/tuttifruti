<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TuttiFrutti</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="container-fluid margenSuperior row ">
        <div class="col-1 margenIzquierdo"></div>
        <div class="col text-center">
            <h1 class="text-center">Tutti - Frutti</h1>
        </div>
    </header>
    <main>
        <!-- PASO 1: ELEGIR MODO -->
        <div id="pasoModo">
            <div class="renglon container-fluid row text-center">
                <div class="col-1 margenIzquierdo"></div>
                <div class="col jugador">
                    <h2>¿Cómo querés jugar?</h2>
                </div>
            </div>
            <div class="renglon container-fluid row text-center">
                <div class="col-1 margenIzquierdo"></div>
                <div class="col">
                    <button id="btnModoMultijugador" class="btn boton1">Multijugador (crear sala)</button>
                </div>
                <div class="col">
                    <button id="btnModoBot" class="btn boton2">Jugar contra la PC</button>
                </div>
                <div class="col">
                    <button id="btnModoUnirse" class="btn boton4">Unirse a sala</button>
                </div>
            </div>
        </div>

        <!-- PASO 2A: MULTIJUGADOR - CREAR SALA -->
        <div id="pasoMultijugador" style="display:none">
            <div class="renglon container-fluid row text-center">
                <div class="col-1 margenIzquierdo"></div>
                <div class="col jugador1 espacio">
                    <h3>Crear sala</h3>
                </div>
            </div>
            <form id="formCrearSala" autocomplete="off">
                <div class="renglon container-fluid row text-center">
                    <div class="col-1 margenIzquierdo"></div>
                    <div class="col jugador1 espacio">
                        <input type="text" class="espacioInputNombre" id="nombreCreador" placeholder="Tu nombre" required>
                    </div>
                </div>
                <div class="renglon container-fluid row text-center">
                    <div class="col-1 margenIzquierdo"></div>
                    <div class="col espacio">
                        <input type="submit" value="Crear sala" class="btn boton4">
                    </div>
                </div>
            </form>

            <div class="renglon container-fluid row text-center">
                <div class="col-1 margenIzquierdo"></div>
                <div class="col">
                    <button id="btnVolverDeMultijugador" class="btn boton3">Volver</button>
                </div>
            </div>
        </div>

        <!-- PASO 2B: BOT - NOMBRE Y NIVEL -->
        <div id="pasoBot" style="display:none">
            <div class="renglon container-fluid row text-center">
                <div class="col-1 margenIzquierdo"></div>
                <div class="col jugador">
                    <h3>Jugar contra la PC</h3>
                </div>
            </div>
            <form id="formJugarBot" autocomplete="off">
                <div class="renglon container-fluid row text-center">
                    <div class="col-1 margenIzquierdo"></div>
                    <div class="col jugador espacio">
                        <input type="text" class="espacioInputNombre" id="nombreJugadorBot" placeholder="Tu nombre" required>
                    </div>
                </div>
                <div class="renglon container-fluid row text-center">
                    <div class="col-1 margenIzquierdo"></div>
                    <div class="col jugador espacio">
                        <select id="nivelBot" class="espacioInputNombre">
                            <option value="facil">IQ Fácil</option>
                            <option value="medio" selected>IQ Medio</option>
                            <option value="dificil">IQ Difícil</option>
                        </select>
                    </div>
                </div>
                <div class="renglon container-fluid row text-center">
                    <div class="col-1 margenIzquierdo"></div>
                    <div class="col espacio">
                        <input type="submit" value="Jugar" class="btn boton4">
                    </div>
                </div>
            </form>
            <div class="renglon container-fluid row text-center">
                <div class="col-1 margenIzquierdo"></div>
                <div class="col">
                    <button id="btnVolverDeBot" class="btn boton3">Volver</button>
                </div>
            </div>
        </div>

        <!-- PASO 2C: UNIRSE A SALA -->
        <div id="pasoUnirse" style="display:none">
            <div class="renglon container-fluid row text-center">
                <div class="col-1 margenIzquierdo"></div>
                <div class="col jugador2 espacio">
                    <h3>Unirse con código</h3>
                </div>
            </div>
            <form id="formUnirseSala" autocomplete="off">
                <div class="renglon container-fluid row text-center">
                    <div class="col-1 margenIzquierdo"></div>
                    <div class="col jugador2 espacio">
                        <input type="text" class="espacioInputNombre" id="nombreInvitado" placeholder="Tu nombre" required>
                    </div>
                </div>
                <div class="renglon container-fluid row text-center">
                    <div class="col-1 margenIzquierdo"></div>
                    <div class="col jugador2 espacio">
                        <input type="text" class="espacioInputNombre" id="codigoSala" placeholder="Código de sala" maxlength="6" style="text-transform:uppercase" required>
                    </div>
                </div>
                <div class="renglon container-fluid row text-center">
                    <div class="col-1 margenIzquierdo"></div>
                    <div class="col espacio">
                        <input type="submit" value="Unirse" class="btn boton4">
                    </div>
                </div>
            </form>

            <div class="renglon container-fluid row text-center">
                <div class="col-1 margenIzquierdo"></div>
                <div class="col">
                    <button id="btnVolverDeUnirse" class="btn boton3">Volver</button>
                </div>
            </div>
        </div>

        <!-- CÓDIGO GENERADO PARA COMPARTIR -->
        <div id="codigoGenerado" class="renglon container-fluid row text-center" style="display:none">
            <div class="col-1 margenIzquierdo"></div>
            <div class="col jugador1">
                <h3>Compartí este código con tu rival:</h3>
                <h1 id="textoCodigoGenerado"></h1>
                <p>Esperando que se una...</p>
            </div>
        </div>
    </main>
    <footer id="margenInferior" class="renglonFinal">
        <div class="renglon container-fluid row renglonFinal">
            <div class="col-1 margenIzquierdo"></div>
            <div class="col text-center" id="renglonGanador"></div>
        </div>
    </footer>

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/clases.js"></script>
    <script src="js/puntaje.js"></script>
    <script src="js/sala.js"></script>
    <script src="js/lobby.js"></script>
</body>
</html>
