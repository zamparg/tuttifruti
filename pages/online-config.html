<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TuttiFrutti - Configuración</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <header class="container-fluid margenSuperior row ">
        <div class="col-1 margenIzquierdo"></div>
        <div class="col text-center">
            <h1 class="text-center">Tutti - Frutti</h1>
        </div>
    </header>
    <main>
        <div class="renglon container-fluid row text-center">
            <div class="col-1 margenIzquierdo"></div>
            <div class="col jugador">
                <h2>Configuración de la partida</h2>
            </div>
        </div>

        <div id="soloCreador">
            <div class="renglon container-fluid row text-center">
                <div class="col-1 margenIzquierdo"></div>
                <div class="col jugador">
                    <h3>Categorías</h3>
                </div>
            </div>
            <div class="container-fluid row seccionLibre">
                <div class="col-1 margenIzquierdo"></div>
                <div class="col listaCategorias" id="listaCategorias"></div>
            </div>
            <div class="renglon container-fluid row text-center">
                <div class="col-1 margenIzquierdo"></div>
                <div class="col espacio">
                    <input type="text" id="inputNuevaCategoria" class="espacioInputNombre" placeholder="Nueva categoría">
                    <button type="button" id="btnAgregarCategoria" class="btn boton1">Agregar</button>
                </div>
            </div>

            <div class="renglon container-fluid row text-center">
                <div class="col-1 margenIzquierdo"></div>
                <div class="col jugador">
                    <h3>Letras a jugar</h3>
                </div>
            </div>
            <div class="container-fluid row seccionLibre">
                <div class="col-1 margenIzquierdo"></div>
                <div class="col grillaLetras" id="grillaLetras"></div>
            </div>

            <div class="renglon container-fluid row text-center">
                <div class="col-1 margenIzquierdo"></div>
                <div class="col jugador espacio">
                    <h3>Timer (segundos):&#160;</h3>
                    <input type="number" id="timer" step="10" min="10" value="60">
                </div>
            </div>

            <div class="renglon container-fluid row text-center">
                <div class="col-1 margenIzquierdo"></div>
                <div class="col">
                    <button id="btnGuardarConfig" class="btn boton4">Guardar configuración</button>
                </div>
            </div>
        </div>

        <div class="renglon container-fluid row text-center">
            <div class="col-1 margenIzquierdo"></div>
            <div class="col">
                <button id="btnListo" class="btn boton1">Estoy listo</button>
            </div>
        </div>

        <div class="renglon container-fluid row text-center">
            <div class="col-1 margenIzquierdo"></div>
            <div class="col" id="estadoConfirmacion">
                <p>Esperando confirmación de ambos jugadores...</p>
            </div>
        </div>
    </main>

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="../js/clases.js"></script>
    <script src="../js/puntaje.js"></script>
    <script src="../js/sala.js"></script>
    <script src="../js/online-config.js"></script>
</body>
</html>
