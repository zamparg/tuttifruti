<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TuttiFrutti</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <header class="container-fluid margenSuperior row ">
        <div class="col-1 margenIzquierdo"></div>
        <div class="col text-center">
            <h1 class="text-center">Tutti - Frutti</h1>
        </div>
        <div class="col-2 text-center">
            <h2 id="espacioLetraRonda"></h2>
        </div>
        <div class="col-2 text-center">
            <h3 id="espacioTimer"></h3>
        </div>
    </header>
    <main id="cuaderno">
        <table class="tablaJuego">
            <thead>
                <tr id="filaEncabezados"></tr>
            </thead>
            <tbody>
                <tr id="filaRespuestas">
                    <td id="espacioJugador1"></td>
                </tr>
            </tbody>
        </table>

        <div class="renglon container-fluid row text-center">
            <div class="col-1 margenIzquierdo"></div>
            <div class="col">
                <button id="btnFinalizar" class="btn boton1">Finalizar</button>
            </div>
        </div>
    </main>
    <section id="renglones"></section>
    <footer id="margenInferior" class="renglonFinal">
        <div class="renglon container-fluid row">
            <div class="col-1 margenIzquierdoFooter"></div>
            <div class="col text-center" id="puntosJugador1"></div>
            <div class="col text-center" id="puntosJugador2"></div>
        </div>
        <div class="renglon container-fluid row renglonFinal">
            <div class="col-1 margenIzquierdoFooter"></div>
            <div class="col text-center" id="renglonGanador"></div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js" integrity="sha384-7+zCNj/IqJ95wo16oMtfsKbZ9ccEh31eOz1HGyDuCQ6wgnyJNSYdrPa03rtR1zdB" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.min.js" integrity="sha384-QJHtvGhmr9XOIpI6YVutG+2QOK9T+ZnN4kzFN1RtK3zEFEIsxhlmWl5/YESvpZ13" crossorigin="anonymous"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="../js/clases.js"></script>
    <script src="../js/puntaje.js"></script>
    <script src="../js/sala.js"></script>
    <script src="../js/bot.js"></script>
    <script src="../js/online-juego.js"></script>
</body>
</html>
